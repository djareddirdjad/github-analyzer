<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>GitHub Analyzer</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{--bg:#0a0a0f;--surface:#111118;--border:#1e1e2e;--accent:#7c6af7;--accent2:#4ade80;--text:#e2e2f0;--muted:#6b6b8a;--card:#13131c}
    body{background:var(--bg);color:var(--text);font-family:'Space Grotesk',sans-serif;min-height:100vh}
    header{padding:48px 32px 32px;max-width:1100px;margin:0 auto;border-bottom:1px solid var(--border)}
    header h1{font-size:clamp(2rem,5vw,3.5rem);font-weight:700;letter-spacing:-0.03em}
    header h1 span{color:var(--accent)}
    header p{margin-top:10px;color:var(--muted);font-family:'JetBrains Mono',monospace;font-size:1rem}
    .search-bar{max-width:1100px;margin:40px auto;padding:0 32px;display:flex;gap:12px}
    .search-bar input{flex:1;background:var(--surface);border:1px solid var(--border);color:var(--text);padding:14px 20px;font-size:1rem;font-family:'JetBrains Mono',monospace;outline:none;border-radius:8px;transition:border-color .2s}
    .search-bar input:focus{border-color:var(--accent)}
    .search-bar input::placeholder{color:var(--muted)}
    .search-bar button{background:var(--accent);color:#fff;border:none;padding:14px 28px;font-size:1rem;font-family:'Space Grotesk',sans-serif;font-weight:600;cursor:pointer;border-radius:8px;transition:opacity .2s}
    .search-bar button:hover{opacity:.85}
    #results{max-width:1100px;margin:0 auto;padding:0 32px 64px}
    .profile-card{display:flex;align-items:center;gap:24px;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:28px;margin-bottom:24px}
    .profile-card img{width:80px;height:80px;border-radius:50%;border:2px solid var(--accent)}
    .profile-card h2{font-size:1.5rem;font-weight:700}
    .handle{color:var(--accent);font-family:'JetBrains Mono',monospace;font-size:.9rem}
    .bio{color:var(--muted);margin-top:6px;font-size:.95rem}
    .stats-row{display:flex;gap:12px;margin-top:12px;flex-wrap:wrap}
    .stat-pill{background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:6px 14px;font-size:.85rem;font-family:'JetBrains Mono',monospace}
    .stat-pill span{color:var(--accent2);font-weight:600}
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:20px}
    @media(max-width:700px){.grid{grid-template-columns:1fr}}
    .card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:24px}
    .card h3{font-size:.75rem;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);margin-bottom:20px;font-family:'JetBrains Mono',monospace}
    .repo-list{display:flex;flex-direction:column;gap:14px}
    .repo-item{border-bottom:1px solid var(--border);padding-bottom:14px}
    .repo-item:last-child{border-bottom:none;padding-bottom:0}
    .repo-item a{color:var(--text);text-decoration:none;font-weight:600;font-size:.95rem}
    .repo-item a:hover{color:var(--accent)}
    .repo-item .desc{color:var(--muted);font-size:.85rem;margin-top:3px}
    .repo-meta{display:flex;gap:14px;margin-top:6px;font-family:'JetBrains Mono',monospace;font-size:.8rem;color:var(--muted)}
    .repo-meta .lang{color:var(--accent2)}
    #loading{text-align:center;padding:60px;color:var(--muted);font-family:'JetBrains Mono',monospace;display:none}
    #error-msg{background:#1c0a0a;border:1px solid #4a1515;color:#f87171;padding:16px 20px;border-radius:8px;font-family:'JetBrains Mono',monospace;font-size:.9rem;display:none;margin-bottom:20px}
  </style>
</head>
<body>
<header>
  <h1>GitHub <span>Analyzer</span></h1>
  <p>// inspect any developer's public footprint</p>
</header>
<div class="search-bar">
  <input id="username-input" type="text" placeholder="enter github username..."/>
  <button onclick="analyze()">Analyze</button>
</div>
<div id="results">
  <div id="error-msg"></div>
  <div id="loading">fetching data...</div>
  <div id="output"></div>
</div>
<script>
  document.getElementById("username-input").addEventListener("keydown",e=>{if(e.key==="Enter")analyze()});
  async function analyze(){
    const username=document.getElementById("username-input").value.trim();
    if(!username)return;
    document.getElementById("output").innerHTML="";
    document.getElementById("error-msg").style.display="none";
    document.getElementById("loading").style.display="block";
    try{
      const res=await fetch("/analyze",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({username})});
      const data=await res.json();
      document.getElementById("loading").style.display="none";
      if(!res.ok){document.getElementById("error-msg").textContent=data.error||"Something went wrong.";document.getElementById("error-msg").style.display="block";return}
      renderResults(data);
    }catch(e){document.getElementById("loading").style.display="none";document.getElementById("error-msg").textContent="Network error.";document.getElementById("error-msg").style.display="block"}
  }
  function renderResults(data){
    const{user,stats}=data;
    const out=document.getElementById("output");
    const joinYear=user.created_at?user.created_at.slice(0,4):"—";
    out.innerHTML=`
      <div class="profile-card">
        <img src="${user.avatar}" alt="${user.login}"/>
        <div>
          <h2>${user.name}</h2>
          <div class="handle">@${user.login} · joined ${joinYear}${user.location?" · "+user.location:""}</div>
          ${user.bio?`<div class="bio">${user.bio}</div>`:""}
          <div class="stats-row">
            <div class="stat-pill"><span>${user.public_repos}</span> repos</div>
            <div class="stat-pill"><span>${stats.total_stars}</span> stars</div>
            <div class="stat-pill"><span>${user.followers}</span> followers</div>
            <div class="stat-pill"><span>${user.following}</span> following</div>
          </div>
        </div>
      </div>
      <div class="grid">
        <div class="card"><h3>Language Breakdown</h3><canvas id="langChart" height="200"></canvas></div>
        <div class="card"><h3>Recent Commit Activity</h3><canvas id="commitChart" height="200"></canvas></div>
      </div>
      <div class="card">
        <h3>Top Repositories</h3>
        <div class="repo-list">
          ${stats.top_repos.map(r=>`<div class="repo-item"><a href="${r.url}" target="_blank">${r.name}</a><div class="desc">${r.description||"no description"}</div><div class="repo-meta"><span class="lang">${r.language}</span><span>★ ${r.stars}</span><span>⑂ ${r.forks}</span><span>updated ${r.updated}</span></div></div>`).join("")}
        </div>
      </div>`;
    const langs=stats.languages;
    const langColors=["#7c6af7","#4ade80","#f472b6","#fb923c","#38bdf8","#a78bfa","#facc15","#f87171"];
    new Chart(document.getElementById("langChart"),{type:"doughnut",data:{labels:Object.keys(langs),datasets:[{data:Object.values(langs),backgroundColor:langColors,borderWidth:0}]},options:{plugins:{legend:{labels:{color:"#e2e2f0",font:{family:"JetBrains Mono",size:11}}}},cutout:"65%"}});
    const commits=stats.commit_activity;
    new Chart(document.getElementById("commitChart"),{type:"bar",data:{labels:Object.keys(commits),datasets:[{data:Object.values(commits),backgroundColor:"#7c6af7",borderRadius:4}]},options:{plugins:{legend:{display:false}},scales:{x:{ticks:{color:"#6b6b8a",font:{family:"JetBrains Mono",size:10},maxTicksLimit:6},grid:{color:"#1e1e2e"}},y:{ticks:{color:"#6b6b8a",font:{family:"JetBrains Mono",size:10}},grid:{color:"#1e1e2e"}}}}});
  }
</script>
</body>
</html>
