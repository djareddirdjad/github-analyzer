<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>GitHub Analyzer</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{--bg:#0a0a0f;--surface:#111118;--border:#1e1e2e;--accent:#7c6af7;--accent2:#4ade80;--accent3:#f472b6;--text:#e2e2f0;--muted:#6b6b8a;--card:#13131c}
    body{background:var(--bg);color:var(--text);font-family:'Space Grotesk',sans-serif;min-height:100vh}
    header{padding:48px 32px 32px;max-width:1100px;margin:0 auto;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:16px}
    header h1{font-size:clamp(2rem,5vw,3.2rem);font-weight:700;letter-spacing:-0.03em}
    header h1 span{color:var(--accent)}
    header p{color:var(--muted);font-family:'JetBrains Mono',monospace;font-size:.9rem;margin-top:6px}
    .api-badge{background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:6px 14px;font-family:'JetBrains Mono',monospace;font-size:.8rem;color:var(--accent2)}
    .search-area{max-width:1100px;margin:32px auto;padding:0 32px;display:flex;flex-direction:column;gap:12px}
    .search-row{display:flex;gap:12px}
    .search-row input{flex:1;background:var(--surface);border:1px solid var(--border);color:var(--text);padding:14px 20px;font-size:1rem;font-family:'JetBrains Mono',monospace;outline:none;border-radius:8px;transition:border-color .2s}
    .search-row input:focus{border-color:var(--accent)}
    .search-row input::placeholder{color:var(--muted)}
    .search-row button{background:var(--accent);color:#fff;border:none;padding:14px 28px;font-size:1rem;font-family:'Space Grotesk',sans-serif;font-weight:600;cursor:pointer;border-radius:8px;transition:opacity .2s;white-space:nowrap}
    .search-row button:hover{opacity:.85}
    .compare-row{display:flex;gap:12px;align-items:center}
    .compare-row input{flex:1;background:var(--surface);border:1px solid var(--border);color:var(--text);padding:10px 16px;font-size:.9rem;font-family:'JetBrains Mono',monospace;outline:none;border-radius:8px;transition:border-color .2s}
    .compare-row input:focus{border-color:var(--accent3)}
    .compare-row input::placeholder{color:var(--muted)}
    .compare-row button{background:transparent;color:var(--accent3);border:1px solid var(--accent3);padding:10px 20px;font-size:.85rem;font-family:'Space Grotesk',sans-serif;font-weight:600;cursor:pointer;border-radius:8px;transition:all .2s;white-space:nowrap}
    .compare-row button:hover{background:var(--accent3);color:#0a0a0f}
    .history-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
    .history-label{font-family:'JetBrains Mono',monospace;font-size:.75rem;color:var(--muted)}
    .history-chip{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:4px 12px;font-size:.8rem;font-family:'JetBrains Mono',monospace;cursor:pointer;transition:border-color .2s;color:var(--text)}
    .history-chip:hover{border-color:var(--accent);color:var(--accent)}
    #results{max-width:1100px;margin:0 auto;padding:0 32px 64px}
    #error-msg{background:#1c0a0a;border:1px solid #4a1515;color:#f87171;padding:16px 20px;border-radius:8px;font-family:'JetBrains Mono',monospace;font-size:.9rem;display:none;margin-bottom:20px}
    #loading{text-align:center;padding:60px;color:var(--muted);font-family:'JetBrains Mono',monospace;display:none}
    .profile-card{display:flex;align-items:flex-start;gap:24px;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:28px;margin-bottom:24px;flex-wrap:wrap}
    .profile-card img{width:80px;height:80px;border-radius:50%;border:2px solid var(--accent);flex-shrink:0}
    .profile-info{flex:1;min-width:200px}
    .profile-card h2{font-size:1.5rem;font-weight:700}
    .handle{color:var(--accent);font-family:'JetBrains Mono',monospace;font-size:.9rem;margin-top:2px}
    .bio{color:var(--muted);margin-top:6px;font-size:.95rem;line-height:1.5}
    .stats-row{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
    .stat-pill{background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:6px 14px;font-size:.82rem;font-family:'JetBrains Mono',monospace}
    .stat-pill span{color:var(--accent2);font-weight:600}
    .profile-actions{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
    .copy-btn{background:transparent;border:1px solid var(--border);color:var(--muted);padding:7px 16px;font-size:.8rem;font-family:'JetBrains Mono',monospace;cursor:pointer;border-radius:6px;transition:all .2s}
    .copy-btn:hover{border-color:var(--accent2);color:var(--accent2)}
    .peak-badges{display:flex;gap:8px;margin-left:auto;flex-wrap:wrap;align-items:flex-start}
    .peak-badge{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:10px 16px;text-align:center}
    .peak-badge .label{font-size:.7rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-family:'JetBrains Mono',monospace}
    .peak-badge .value{font-size:1.1rem;font-weight:700;color:var(--accent);margin-top:2px;font-family:'JetBrains Mono',monospace}
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:20px}
    .grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:20px;margin-bottom:20px}
    @media(max-width:800px){.grid,.grid-3{grid-template-columns:1fr}}
    .card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:24px}
    .card h3{font-size:.72rem;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);margin-bottom:20px;font-family:'JetBrains Mono',monospace}
    .repo-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
    @media(max-width:600px){.repo-grid{grid-template-columns:1fr}}
    .repo-item{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:16px;transition:border-color .2s}
    .repo-item:hover{border-color:var(--accent)}
    .repo-item a{color:var(--text);text-decoration:none;font-weight:600;font-size:.95rem}
    .repo-item a:hover{color:var(--accent)}
    .repo-item .desc{color:var(--muted);font-size:.82rem;margin-top:4px;line-height:1.4}
    .repo-meta{display:flex;gap:12px;margin-top:8px;font-family:'JetBrains Mono',monospace;font-size:.78rem;color:var(--muted);flex-wrap:wrap}
    .repo-meta .lang{color:var(--accent2)}
    .topics{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
    .topic{background:#1e1e3a;color:#a5b4fc;border-radius:20px;padding:2px 10px;font-size:.72rem;font-family:'JetBrains Mono',monospace}
    .compare-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:20px}
    @media(max-width:700px){.compare-grid{grid-template-columns:1fr}}
    .compare-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:20px}
    .compare-card h4{font-size:.8rem;color:var(--accent3);font-family:'JetBrains Mono',monospace;margin-bottom:12px;text-transform:uppercase;letter-spacing:.08em}
    .compare-stat{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border);font-size:.9rem}
    .compare-stat:last-child{border-bottom:none}
    .compare-stat .val{font-family:'JetBrains Mono',monospace;font-weight:600;color:var(--accent2)}
    .winner{color:var(--accent2) !important}
  </style>
</head>
<body>
<header>
  <div>
    <h1>GitHub <span>Analyzer</span></h1>
    <p>// inspect any developer's public footprint</p>
  </div>
  <div class="api-badge">API: /api/user/:username</div>
</header>

<div class="search-area">
  <div class="search-row">
    <input id="username-input" type="text" placeholder="enter github username..."/>
    <button onclick="analyze()">Analyze</button>
  </div>
  <div class="compare-row">
    <input id="compare-input" type="text" placeholder="compare with another username (optional)..."/>
    <button onclick="compareUsers()">Compare</button>
  </div>
  <div class="history-row" id="history-row" style="display:none">
    <span class="history-label">recent:</span>
    <div id="history-chips"></div>
  </div>
</div>

<div id="results">
  <div id="error-msg"></div>
  <div id="loading">fetching data...</div>
  <div id="compare-output"></div>
  <div id="output"></div>
</div>

<script>
  const DAYS = ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
  let history = JSON.parse(sessionStorage.getItem("gh_history") || "[]");
  let chartInstances = [];

  function destroyCharts(){chartInstances.forEach(c=>c.destroy());chartInstances=[];}

  document.getElementById("username-input").addEventListener("keydown",e=>{if(e.key==="Enter")analyze()});

  function saveHistory(u){
    history = [u, ...history.filter(x=>x!==u)].slice(0,5);
    sessionStorage.setItem("gh_history", JSON.stringify(history));
    renderHistory();
  }

  function renderHistory(){
    const row = document.getElementById("history-row");
    const chips = document.getElementById("history-chips");
    if(!history.length){row.style.display="none";return;}
    row.style.display="flex";
    chips.innerHTML = history.map(u=>`<span class="history-chip" onclick="loadHistory('${u}')">${u}</span>`).join("");
  }

  function loadHistory(u){
    document.getElementById("username-input").value=u;
    analyze();
  }

  renderHistory();

  async function fetchUser(username){
    const res = await fetch("/analyze",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({username})});
    return res.json();
  }

  async function analyze(){
    const username = document.getElementById("username-input").value.trim();
    if(!username) return;
    destroyCharts();
    document.getElementById("output").innerHTML="";
    document.getElementById("compare-output").innerHTML="";
    document.getElementById("error-msg").style.display="none";
    document.getElementById("loading").style.display="block";
    try{
      const data = await fetchUser(username);
      document.getElementById("loading").style.display="none";
      if(data.error){document.getElementById("error-msg").textContent=data.error;document.getElementById("error-msg").style.display="block";return;}
      saveHistory(username);
      renderResults(data, "output");
    }catch(e){
      document.getElementById("loading").style.display="none";
      document.getElementById("error-msg").textContent="Network error.";
      document.getElementById("error-msg").style.display="block";
    }
  }

  async function compareUsers(){
    const u1 = document.getElementById("username-input").value.trim();
    const u2 = document.getElementById("compare-input").value.trim();
    if(!u1||!u2){alert("Enter both usernames first.");return;}
    destroyCharts();
    document.getElementById("output").innerHTML="";
    document.getElementById("compare-output").innerHTML="";
    document.getElementById("error-msg").style.display="none";
    document.getElementById("loading").style.display="block";
    try{
      const [d1,d2] = await Promise.all([fetchUser(u1),fetchUser(u2)]);
      document.getElementById("loading").style.display="none";
      if(d1.error||d2.error){document.getElementById("error-msg").textContent=d1.error||d2.error;document.getElementById("error-msg").style.display="block";return;}
      renderCompare(d1,d2);
      renderResults(d1,"output");
    }catch(e){
      document.getElementById("loading").style.display="none";
      document.getElementById("error-msg").textContent="Network error.";
      document.getElementById("error-msg").style.display="block";
    }
  }

  function renderCompare(d1,d2){
    const out = document.getElementById("compare-output");
    const metrics = [
      {label:"Public Repos", v1:d1.user.public_repos, v2:d2.user.public_repos},
      {label:"Total Stars", v1:d1.stats.total_stars, v2:d2.stats.total_stars},
      {label:"Followers", v1:d1.user.followers, v2:d2.user.followers},
      {label:"Following", v1:d1.user.following, v2:d2.user.following},
    ];
    const row = (m) => {
      const w1 = m.v1>=m.v2?"winner":"";
      const w2 = m.v2>m.v1?"winner":"";
      return `<div class="compare-stat"><span>${m.label}</span><span class="val ${w1}">${m.v1}</span><span class="val ${w2}">${m.v2}</span></div>`;
    };
    out.innerHTML = `
      <div style="margin-bottom:20px">
        <div class="card">
          <h3>Head-to-Head Comparison</h3>
          <div class="compare-grid">
            <div class="compare-card"><h4>@${d1.user.login}</h4>${metrics.map(m=>`<div class="compare-stat"><span>${m.label}</span><span class="val ${m.v1>=m.v2?'winner':''}">${m.v1}</span></div>`).join("")}</div>
            <div class="compare-card"><h4>@${d2.user.login}</h4>${metrics.map(m=>`<div class="compare-stat"><span>${m.label}</span><span class="val ${m.v2>m.v1?'winner':''}">${m.v2}</span></div>`).join("")}</div>
          </div>
        </div>
      </div>`;
  }

  function renderResults(data, containerId){
    const {user,stats} = data;
    const out = document.getElementById(containerId);
    const joinYear = user.created_at?user.created_at.slice(0,4):"—";
    const peakHourStr = stats.peak_hour!==null ? `${stats.peak_hour}:00–${stats.peak_hour+1}:00 UTC` : "—";

    const summary = `@${user.login} | ${user.public_repos} repos | ${stats.total_stars} stars | ${user.followers} followers | ${Object.keys(stats.languages).slice(0,3).join(", ")} | github.com/${user.login}`;

    out.innerHTML = `
      <div class="profile-card">
        <img src="${user.avatar}" alt="${user.login}"/>
        <div class="profile-info">
          <h2>${user.name}</h2>
          <div class="handle">@${user.login} · joined ${joinYear}${user.location?" · "+user.location:""}</div>
          ${user.bio?`<div class="bio">${user.bio}</div>`:""}
          <div class="stats-row">
            <div class="stat-pill"><span>${user.public_repos}</span> repos</div>
            <div class="stat-pill"><span>${stats.total_stars}</span> stars</div>
            <div class="stat-pill"><span>${user.followers}</span> followers</div>
            <div class="stat-pill"><span>${user.following}</span> following</div>
          </div>
          <div class="profile-actions">
            <button class="copy-btn" onclick="copyToClipboard('${summary}', this)">copy summary</button>
            <a href="https://github.com/${user.login}" target="_blank"><button class="copy-btn">view on github ↗</button></a>
          </div>
        </div>
        ${(stats.peak_hour!==null||stats.peak_day)?`
        <div class="peak-badges">
          ${stats.peak_day?`<div class="peak-badge"><div class="label">peak day</div><div class="value">${stats.peak_day}</div></div>`:""}
          ${stats.peak_hour!==null?`<div class="peak-badge"><div class="label">peak hour</div><div class="value">${stats.peak_hour}:00</div></div>`:""}
        </div>`:""}
      </div>

      <div class="grid">
        <div class="card"><h3>Language Breakdown</h3><canvas id="${containerId}_langChart" height="200"></canvas></div>
        <div class="card"><h3>Commit Activity (30 days)</h3><canvas id="${containerId}_commitChart" height="200"></canvas></div>
      </div>

      <div class="grid">
        <div class="card"><h3>Activity by Hour</h3><canvas id="${containerId}_hourChart" height="180"></canvas></div>
        <div class="card"><h3>Activity by Day</h3><canvas id="${containerId}_dayChart" height="180"></canvas></div>
      </div>

      <div class="card" style="margin-bottom:20px">
        <h3>Top Repositories</h3>
        <div class="repo-grid">
          ${stats.top_repos.map(r=>`
            <div class="repo-item">
              <a href="${r.url}" target="_blank">${r.name}</a>
              <div class="desc">${r.description||"no description"}</div>
              <div class="repo-meta">
                <span class="lang">${r.language}</span>
                <span>★ ${r.stars}</span>
                <span>⑂ ${r.forks}</span>
                <span>${r.updated}</span>
              </div>
              ${r.topics.length?`<div class="topics">${r.topics.map(t=>`<span class="topic">${t}</span>`).join("")}</div>`:""}
            </div>`).join("")}
        </div>
      </div>`;

    const langColors=["#7c6af7","#4ade80","#f472b6","#fb923c","#38bdf8","#a78bfa","#facc15","#f87171"];
    const gridColor="#1e1e2e";
    const tickStyle={color:"#6b6b8a",font:{family:"JetBrains Mono",size:10}};

    chartInstances.push(new Chart(document.getElementById(`${containerId}_langChart`),{
      type:"doughnut",
      data:{labels:Object.keys(stats.languages),datasets:[{data:Object.values(stats.languages),backgroundColor:langColors,borderWidth:0}]},
      options:{plugins:{legend:{labels:{color:"#e2e2f0",font:{family:"JetBrains Mono",size:11}}}},cutout:"65%"}
    }));

    const commits=stats.commit_activity;
    chartInstances.push(new Chart(document.getElementById(`${containerId}_commitChart`),{
      type:"bar",
      data:{labels:Object.keys(commits),datasets:[{data:Object.values(commits),backgroundColor:"#7c6af7",borderRadius:4}]},
      options:{plugins:{legend:{display:false}},scales:{x:{ticks:{...tickStyle,maxTicksLimit:6},grid:{color:gridColor}},y:{ticks:tickStyle,grid:{color:gridColor}}}}
    }));

    const hours=stats.hour_activity;
    chartInstances.push(new Chart(document.getElementById(`${containerId}_hourChart`),{
      type:"bar",
      data:{labels:Object.keys(hours).map(h=>h+"h"),datasets:[{data:Object.values(hours),backgroundColor:"#4ade80",borderRadius:3}]},
      options:{plugins:{legend:{display:false}},scales:{x:{ticks:{...tickStyle,maxTicksLimit:12},grid:{color:gridColor}},y:{ticks:tickStyle,grid:{color:gridColor}}}}
    }));

    const days=stats.day_activity;
    chartInstances.push(new Chart(document.getElementById(`${containerId}_dayChart`),{
      type:"bar",
      data:{labels:Object.keys(days),datasets:[{data:Object.values(days),backgroundColor:"#f472b6",borderRadius:3}]},
      options:{plugins:{legend:{display:false}},scales:{x:{ticks:tickStyle,grid:{color:gridColor}},y:{ticks:tickStyle,grid:{color:gridColor}}}}
    }));
  }

  function copyToClipboard(text, btn){
    navigator.clipboard.writeText(text).then(()=>{
      btn.textContent="copied!";
      setTimeout(()=>{btn.textContent="copy summary"},2000);
    });
  }
</script>
</body>
</html>
